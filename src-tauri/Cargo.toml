[package]
name = "vitra"
version = "0.1.0"
description = "Vitra — todos os seus programas num só lugar"
edition = "2021"

[lib]
name = "vitra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vitra-core = { path = "../crates/vitra-core" }
