name: Build do Vitra (Windows)

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Instalar dependências
        run: npm ci

      - name: Testes da interface
        run: npm test

      - name: Testes do núcleo
        run: cargo test -p vitra-core

      - name: Baixar SDK do Everything (busca de arquivos)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "everything-sdk.zip"
          $dir = Join-Path $env:RUNNER_TEMP "everything-sdk"
          Invoke-WebRequest -Uri "https://www.voidtools.com/Everything-SDK.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem -Recurse $dir -Filter "Everything64.dll" | Select-Object -First 1
          if (-not $dll -or $dll.Length -eq 0) { throw "Everything64.dll não encontrada (ou vazia) no SDK" }
          New-Item -ItemType Directory -Force "src-tauri\resources" | Out-Null
          Copy-Item $dll.FullName "src-tauri\resources\Everything64.dll"
          Get-Item "src-tauri\resources\Everything64.dll" | Format-List Name, Length

      - name: Gerar instalador
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Vitra-instalador
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Testar o app instalado (instala, abre e confere)
        shell: pwsh
        run: ./.github/scripts/smoke.ps1

  integracao:
    name: Testes no Windows de verdade
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: integracao

      - name: Gerar a interface (o app precisa dela para compilar)
        run: |
          npm ci
          npm run build

      - name: Baixar SDK do Everything
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "everything-sdk.zip"
          $dir = Join-Path $env:RUNNER_TEMP "everything-sdk"
          Invoke-WebRequest -Uri "https://www.voidtools.com/Everything-SDK.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $dll = Get-ChildItem -Recurse $dir -Filter "Everything64.dll" | Select-Object -First 1
          New-Item -ItemType Directory -Force "src-tauri\resources" | Out-Null
          Copy-Item $dll.FullName "src-tauri\resources\Everything64.dll"

      - name: Instalar Everything e a ferramenta do Bitwarden
        shell: pwsh
        run: |
          choco install everything bitwarden-cli -y --no-progress
          $ev = @("$env:ProgramFiles\Everything\Everything.exe", "${env:ProgramFiles(x86)}\Everything\Everything.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ev) { throw "Everything não instalado" }
          Start-Process $ev -ArgumentList "-startup"
          Get-ChildItem "C:\\ProgramData\\chocolatey\\bin\\bw*" -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Rodar os testes de integração
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;" + $env:PATH
          cargo test -p vitra --lib -- --ignored --nocapture --test-threads=1
