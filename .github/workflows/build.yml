name: Build do Vitra (Windows)

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Instalar dependências
        run: npm ci

      - name: Testes da interface
        run: npm test

      - name: Testes do núcleo
        run: cargo test -p vitra-core

      - name: Gerar instalador
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Vitra-instalador
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
